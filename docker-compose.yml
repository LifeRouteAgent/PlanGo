services:
  mysql:
    image: mysql:8.0
    container_name: liferoute-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在本机环境或 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: life_route_agent
    ports:
      - "3306:3306"
    volumes:
      - liferoute_mysql_data:/var/lib/mysql
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: liferoute-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - liferoute_etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: liferoute-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在本机环境或 .env 中设置 MINIO_SECRET_KEY}
    command: minio server /minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - liferoute_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: liferoute-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?请在本机环境或 .env 中设置 MINIO_SECRET_KEY}
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - liferoute_milvus_data:/var/lib/milvus

  backend:
    build:
      context: ./backend
    container_name: liferoute-backend
    environment:
      LIFEROUTE_CONFIG_PATH: /app/config.docker.json
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在本机环境或 .env 中设置 MYSQL_ROOT_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AMAP_API_KEY: ${AMAP_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: liferoute-frontend
    environment:
      VITE_BACKEND_PROXY: http://backend:8000
      AMAP_API_KEY: ${AMAP_API_KEY:-}
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  liferoute_mysql_data:
  liferoute_etcd_data:
  liferoute_minio_data:
  liferoute_milvus_data:
