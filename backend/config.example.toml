# LifeRouteAgent 示例配置
# 复制为 config.local.toml 并填入真实 key，该文件不提交 Git

[app]
APP_ENV = "local"
DEBUG = false

[llm]
LLM_PROVIDER = "deepseek"
DEEPSEEK_API_KEY = ""
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-pro"
DEEPSEEK_REASONING_EFFORT = "high"
DEEPSEEK_THINKING_ENABLED = false
MAX_RECENT_TURNS = 8

[route]
ROUTE_PROVIDER = "amap"
DEFAULT_CITY = "北京"
DEFAULT_DISTANCE_KM = 8
DEFAULT_BUDGET_LEVEL = "medium"
AMAP_API_KEY = ""
AMAP_ROUTE_ENABLED = false

[database]
DATABASE_URL = ""
LIFEROUTE_USE_DATABASE = true
DATABASE_HOST = "127.0.0.1"
DATABASE_PORT = 3306
DATABASE_USER = "root"
DATABASE_PASSWORD = ""
DATABASE_NAME = "life_route_agent"

[redis]
REDIS_URL = ""
ES_URL = ""

[milvus]
MILVUS_ENABLED = true
MILVUS_HOST = "127.0.0.1"
MILVUS_PORT = 19530
MILVUS_COLLECTION_MEMORY = "liferoute_memory"
MILVUS_COLLECTION_USER_PROFILE = "liferoute_user_profile_vectors"
EMBEDDING_PROVIDER = "local_bge"
EMBEDDING_MODEL_PATH = "BAAI/bge-small-zh-v1.5"
EMBEDDING_DIMENSION = 512

[runtime]
RUNTIME_STORE = "mysql"
RUNTIME_MYSQL_ENABLED = true
PROMPT_VERSION_ENFORCED = true

[memory]
ENABLE_MEMORY = true
ENABLE_VERIFICATION = true
ENABLE_TRACE = true

[kafka]
KAFKA_ENABLED = false
KAFKA_BOOTSTRAP_SERVERS = "127.0.0.1:9092"
KAFKA_MEMORY_TOPIC = "liferoute.memory.events"
